name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: set up JDK 25
      uses: actions/setup-java@v6.1.0
      with:
        java-version: '27'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android SDK 37
      run: |
        veritalex_sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        if [ -x "$veritalex_sdk_root/cmdline-tools/latest/bin/android" ]; then
          "$veritalex_sdk_root/cmdline-tools/latest/bin/android" sdk install platforms/android-37.0 build-tools/36.0.0
        else
          "$veritalex_sdk_root/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:lintDebug
